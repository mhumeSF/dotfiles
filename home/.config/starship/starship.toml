format = """
[#](bold blue) $kubernetes$aws${custom.tf}
[#](bold blue) $directory$git_branch$git_status${custom.git_clean}$git_state
$character"""

# Rendered on the input line, flush right; disappears when the command wraps.
right_format = "$cmd_duration$jobs$sudo$nix_shell$direnv"

add_newline = true

# custom.tf spawns a shell to run tfenv; in dirs with a heavy env (e.g. direnv
# loading 1Password secrets) that can exceed the 500ms default even though
# tfenv itself is fast.
command_timeout = 2000

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold yellow"
format = "on [$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
stashed = "*${count}"
modified = "✖"
staged = "+"
untracked = "?"
deleted = "-"

# Shown only when git_status/ahead_behind would otherwise be empty: no
# unstaged/staged/untracked changes, no unpushed/unpulled commits, no stash.
[custom.git_clean]
command = "echo ''"
when = '''
out=$(git status --porcelain --branch 2>/dev/null) || exit 1
[ "$(printf '%s\n' "$out" | wc -l)" -eq 1 ] || exit 1
printf '%s\n' "$out" | head -1 | grep -qE '\[(ahead|behind)' && exit 1
[ -z "$(git stash list 2>/dev/null)" ]
'''
shell = ["bash", "--noprofile", "--norc"]
format = "[✓]($style) "
style = "bold green"

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold red"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "yellow"

[jobs]
symbol = "✦"
format = "[$symbol$number]($style) "
style = "bold purple"

[sudo]
disabled = false
symbol = " "
format = "[$symbol]($style)"
style = "bold red"

[nix_shell]
symbol = " "
format = "[$symbol]($style)"
style = "bold blue"

[direnv]
disabled = false
symbol = "󰌪 "
# Quiet leaf when the .envrc is allowed; shouts only when it isn't.
format = "[$symbol$allowed]($style)"
allowed_msg = ""
not_allowed_msg = "✗not-allowed "
denied_msg = "✗denied "
style = "yellow"

[kubernetes]
disabled = false
style = "bold cyan"
format = 'k8s:[$context( \($namespace\))]($style) '

# Prod first so it always gets the warning style, even for aliased clusters.
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold black bg:yellow"

# Shorten Tailscale FQDNs to the machine name: chi.tail08a730.ts.net -> chi
[[kubernetes.contexts]]
context_pattern = "(?P<cluster>[\\w-]+)\\.tail08a730\\.ts\\.net"
context_alias = "$cluster"

[aws]
style = "bold white"
format = '// aws:[$profile( \($region\))]($style) '

# tfenv-resolved terraform version. Shown when TFENV_TERRAFORM_VERSION is set
# or the current dir / repo root looks like terraform.
[custom.tf]
command = "tfenv version-name 2>/dev/null"
shell = ["bash", "--noprofile", "--norc"]
when = '''
[ -n "$TFENV_TERRAFORM_VERSION" ] && exit 0
ls *.tf >/dev/null 2>&1 && exit 0
{ [ -f .terraform-version ] || [ -d .terraform ]; } && exit 0
r=$(git rev-parse --show-toplevel 2>/dev/null) || exit 1
[ -f "$r/.terraform-version" ] || ls "$r"/*.tf >/dev/null 2>&1
'''
style = "bold purple"
format = "// tf:[$output]($style) "

[character]
format = "$symbol"
success_symbol = "[➜](bold green) "
error_symbol = "[✖](bold red) "
